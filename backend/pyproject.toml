[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recallops-api"
version = "0.1.0"
description = "Initial FastAPI service for RecallOps"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.5,<2.0",
    "boto3[crt]>=1.43.42,<2.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.3.4,<4.0",
    "sqlalchemy>=2.0.51,<2.1",
    "sqlalchemy-cockroachdb>=2.0.4,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
